name: Build (development)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the development images
        run: docker compose build

      - name: Start the development services
        run: docker compose up -d

      - name: Check that the web server responds
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5002/ && curl -fsS http://localhost:5002/static/hello.txt; then
              echo "Web server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Web server did not respond in time. Logs:"
          docker compose logs
          exit 1

      - name: Shut down
        if: always()
        run: docker compose down -v
